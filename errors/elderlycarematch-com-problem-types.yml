problem_types:
- code: -32601
  title: Method not found
  status: 200
  remediation: Use one of SendMessage, GetTask or ListTasks (the 1.0 names from the GET descriptor); message/send and tasks/get are also accepted.
- code: -32001
  title: Task not found
  status: 200
  remediation: Task ids come from a prior SendMessage result; tasks complete synchronously, so GetTask is rarely needed.
- code: null
  title: Unlisted facility slug
  status: 200
  shape: result artifact with found:false
  remediation: Take slugs only from a find-care-facilities result; the agent never returns a nearest guess.
- code: null
  title: No matching guides
  status: 200
  shape: result artifact listing the most recent guides, labelled as recent
  remediation: Treat a "recent" label as a miss, not a match.
