format: jsonrpc-2.0-error
envelope:
  media_type: application/json
  http_status_on_error: 200
  fields:
  - name: jsonrpc
    description: Always "2.0".
  - name: id
    description: Echo of the request id.
  - name: error.code
    description: Integer JSON-RPC code; standard codes for protocol errors, A2A-defined -32001..-32007 range for task errors.
  - name: error.message
    description: Short human string.
  note: >-
    Not RFC 9457 and not HTTP-status-coded — protocol and application errors both ride an HTTP 200 with a
    JSON-RPC error object, as A2A over JSON-RPC prescribes. There is no error reference page; the two
    codes below are the ones observed, and llms.txt documents none. Skill-level "soft" failures are returned
    as successful results with explanatory content instead (an unknown facility slug returns found:false;
    a guide search with no match returns the most recent guides labelled as recent, not as matches), so a
    client must read the result body, not just the error field, to know whether it got what it asked for.
