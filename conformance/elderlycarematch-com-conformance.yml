sector: senior-care directory / placement referral (Washington State, USA)
summary: >-
  Elderly Care Match's machine surface is an Agent2Agent stack and nothing else: an A2A 1.0-shaped agent
  card at the RFC 8615 well-known path (also mirrored at the legacy agent.json path), a JSON-RPC 2.0
  endpoint that completes real tasks anonymously, an llms.txt that documents the agent, and a robots.txt
  that explicitly Allow-lists /.well-known/ and /a2a/ for every crawler including the named AI agents. It
  declares no OAuth/OIDC (none is needed), no RFC 9457 problem details (errors are JSON-RPC error
  objects), no RFC 9116 security.txt, no RFC 9727 api-catalog and no OpenAPI. No healthcare interchange
  standard (FHIR, HL7v2, X12) is declared on the contract, and none is expected: the agent serves public
  facility-directory records, not clinical or claims data. The privacy policy claims HIPAA-covered-entity
  status for the human platform's intake forms, which is a legal regime claim about the website rather
  than a contract conformance, and is recorded under regulatory/ instead.
