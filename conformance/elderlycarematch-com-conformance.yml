domain_standard_signature:
  present: false
  note: >-
    The senior-care directory market has no interchange standard the contract could declare (no FHIR
    Location/Organization resources, no HL7, no CMS Care Compare schema). The care-type vocabulary the card
    enforces (Adult AFH, Assisted Living, Memory Care, Nursing Home, Independent Living) is the provider's
    own, aligned with Washington DSHS/ALTSA licence categories by prose, not by a declared schema URN.
    Reward-only check; nothing is invented to fill it.
