aid: elderlycarematch-com
name: Elderly Care Match
description: >-
  Elderly Care Match is a Washington State senior-care directory and placement service that helps families
  find and compare licensed adult family homes (AFH), assisted living, memory care, nursing homes / skilled
  nursing and independent living, with listings that are free to browse, many cross-checked against the WA
  DSHS/ALTSA licence registry, and coverage strongest across the Seattle-Tacoma-Bellevue / Puget Sound metro.
  Its only machine interface is an Agent2Agent (A2A 1.0) agent: a card served at
  /.well-known/agent-card.json and a JSON-RPC 2.0 endpoint at https://www.elderlycarematch.com/a2a/v1 that
  answers anonymously with four read-only skills — search facilities by location, care type, Medicaid
  acceptance, vacancy and price; fetch a facility's public profile; search the Learning Center guides; and
  hand a family off to a care advisor by returning a public form URL. It publishes no OpenAPI, SDK or MCP
  server; llms.txt is the documentation and robots.txt explicitly welcomes AI crawlers on /.well-known/ and
  /a2a/.
