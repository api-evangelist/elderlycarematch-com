apis:
- aid: elderlycarematch-com:elderly-care-match-a2a-agent
  name: Elderly Care Match A2A Agent
  description: >-
    Agent2Agent (A2A 1.0) surface: an agent card at https://www.elderlycarematch.com/.well-known/agent-card.json
    (version 1.5.3, one JSONRPC interface, also mirrored at the legacy /.well-known/agent.json) and a JSON-RPC
    2.0 endpoint at https://www.elderlycarematch.com/a2a/v1 that requires no authentication and answers
    SendMessage / GetTask / ListTasks (the 0.3-era message/send and tasks/get are accepted too). Four
    read-only skills — find-care-facilities, get-facility-details, search-care-guides and
    request-placement-help — return operator-maintained public listings for Washington State senior care;
    the agent accepts and returns no resident, family or health information. Streaming and push
    notifications are declared unsupported; results complete synchronously as a Task with a text/markdown
    or JSON artifact.
  humanURL: https://www.elderlycarematch.com/llms.txt
  baseURL: https://www.elderlycarematch.com/a2a/v1
