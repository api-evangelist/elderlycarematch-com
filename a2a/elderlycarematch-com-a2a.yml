agent_card:
  name: Elderly Care Match
  description: >-
    Search licensed Washington senior care: adult family homes (AFH), assisted living, memory care, nursing
    homes / skilled nursing, independent living and 55+ communities. Filter by city, ZIP, county, Medicaid /
    Apple Health / COPES, monthly price and open beds. Read-only and no PHI/PII; placement help is a public
    form link only. Coverage strongest in the Seattle-Tacoma-Bellevue metro and statewide Washington.
  version: 1.5.3
  supported_interfaces:
  - url: https://www.elderlycarematch.com/a2a/v1
    protocol_binding: JSONRPC
    protocol_version: '1.0'
  url: https://www.elderlycarematch.com/a2a/v1
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  provider:
    organization: Elderly Care Match
    url: https://www.elderlycarematch.com
  documentation_url: https://www.elderlycarematch.com/llms.txt
  icon_url: https://www.elderlycarematch.com/images/brand/icon-512.png
  capabilities:
    streaming: false
    push_notifications: false
    extended_agent_card: false
  default_input_modes: [text/plain, application/json]
  default_output_modes: [text/plain, text/markdown, application/json]
  security_schemes: null
  security: null
  skill_count: 4
  skills:
  - {id: find-care-facilities, name: Find senior care facilities, tags: 27, examples: 7, note: 'Natural language or a JSON filter object (location, careTypes, acceptsMedicaid, hasVacancy, min/maxMonthlyPrice, radiusMiles, search, limit<=20).'}
  - {id: get-facility-details, name: Get a facility profile, tags: 8, examples: 3, note: 'By slug or id; unknown slug returns found:false rather than a nearest guess.'}
  - {id: search-care-guides, name: Search elder-care guides, tags: 15, examples: 6, note: 'Learning Center articles by search term or question; slug returns one article in full.'}
  - {id: request-placement-help, name: Hand off to a care advisor, tags: 6, examples: 3, note: 'Returns only the public callback-request URL; explicitly accepts no personal or health data.'}
conformance:
  spec: A2A 1.0.0
  grade: flavored
  grade_claimed_note: >-
    Graded with the catalog's shared rubric (lib_agent_card.grade_agent_card), which is the only grader that
    decides. The card FAILS one hard check — there is no top-level protocolVersion — so it is `flavored`
    even though it is, in practice, one of the most complete and best-behaved cards in the catalog. The
    version is declared, but inside supportedInterfaces[0].protocolVersion ("1.0"), which is where the A2A
    1.0 AgentCard object moved it; the rubric reads the top-level field. Recorded as the rules produce it,
    with the observation kept here so a reader sees both.
  protocol_version: '1.0'
  protocol_version_location: supportedInterfaces[0].protocolVersion (top-level field absent)
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: false
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  deviations:
  - id: no-protocolVersion
    field: protocolVersion
    observed: absent at the top level; present as supportedInterfaces[0].protocolVersion = "1.0"
    note: The one hard-check failure. A 1.0-shaped card with the version nested in the interface entry.
  - id: supportedInterfaces-instead-of-additionalInterfaces
    field: supportedInterfaces / url / preferredTransport
    observed: a single supportedInterfaces[] entry (JSONRPC, 1.0); no top-level url, preferredTransport or additionalInterfaces
    note: >-
      Consistent with the A2A 1.0 AgentCard, which replaced the 0.3 top-level url + preferredTransport +
      additionalInterfaces triple with supportedInterfaces[]. A reader written against 0.3 finds no url.
  - field: securitySchemes / security
    observed: absent
    note: >-
      No authentication is declared and none is required — the endpoint answered an anonymous SendMessage
      with real results. The site's llms.txt states "no authentication required" explicitly. Correct for
      an open read-only agent, but a client cannot tell "open" from "forgot to declare" without probing.
  - field: capabilities.streaming / pushNotifications / extendedAgentCard
    observed: all false
    note: Declared honestly; the agent is request-response only.
  - field: signatures
    observed: absent
    note: No JWS signature block, so the card's authenticity rests on TLS to www.elderlycarematch.com (HSTS max-age 63072000 is set).
surface_relationship:
  note: >-
    A2A is the ONLY machine interface Elderly Care Match publishes. There is no OpenAPI, no GraphQL and no
    MCP server (tools/list is rejected with -32601), and the internal REST router under /api/ is disallowed
    by robots.txt for every crawler and answers {"error":"Not found"} at its roots, so it was not probed
    further. The four A2A skills are the whole public contract, and the site's llms.txt is the whole public
    documentation. The site itself is a client-rendered SPA (Vite bundle, empty #root shell), so the human
    pages exist only after script execution; the agent surface is, unusually, MORE machine-readable than the
    website.
