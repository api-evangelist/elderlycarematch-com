discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: www.elderlycarematch.com
  note: >-
    Served from the www host, which is the site's canonical origin: the apex elderlycarematch.com answers
    every path, /.well-known/* included, with a 307 to www. The legacy /.well-known/agent.json returns the
    byte-identical document (9,905 bytes, same ETag family). The host does not path-echo: every other
    /.well-known/* name on the closed probe list returns a Vercel text/plain 404 ("The page could not be
    found NOT_FOUND"), and a negative-control path
    (/.well-known/elderlycarematch-negative-control-7f3a9c1e.json) also 404s, so the 200 is a served
    document and not an SPA catch-all. Note that the SPA DOES catch-all at the site root — /openapi.json,
    /apis.json, /rss.xml and /docs all answer 200 with the 2,316-byte index.html shell — which is why only
    /.well-known/ and /a2a/ (both explicitly Allow-listed in robots.txt) count as served surfaces here.
    Ownership is not in question: provider.organization is "Elderly Care Match" with provider.url
    https://www.elderlycarematch.com, iconUrl and documentationUrl resolve on the same host, robots.txt
    names the card by URL, and the site's own llms.txt links it under "Agent interfaces".
