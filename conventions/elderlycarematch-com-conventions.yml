  description: >-
    Not applicable: there is no write surface. All four skills read public listings or articles, and the
    one that concerns a family (request-placement-help) returns a URL to a public web form and, per the
    card, "exposes no endpoint that would accept" personal data. Replaying any call has no side effect.
dry_run_mode:
  supported: na
  description: Not applicable — read-only surface; every call is already side-effect free.
reversibility:
  grade: na
  description: >-
    Not applicable — the agent performs no action that could need reversing. It creates nothing, books
    nothing, submits nothing and holds no bed; the card states that openings and prices are "a reason to
    call, not a held bed", and the placement hand-off is completed by the family on the website, outside
    the agent. No cancel/refund/void/undo operation exists because no forward operation exists.
  write_surfaces: []
notes:
- The endpoint is CORS-open (access-control-allow-origin *), so a browser-side agent can call it directly.
- Coverage is Washington State; the card asks agents to route non-WA searches to another directory rather than expect empty results to mean "no care exists".
- Care types are an enumerated vocabulary with documented aliases (AFH -> Adult AFH, SNF -> Nursing Home, etc.); sending an unlisted care type is the most likely client error and is documented in the skill description rather than in an error code.
