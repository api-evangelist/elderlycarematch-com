  result: >-
    {task: {id, contextId, status: {state, timestamp}, artifacts: [{artifactId, name (= skill id),
    description, parts: [{text}]}]}} — the observed SendMessage result returned status.state
    TASK_STATE_COMPLETED synchronously with a text/markdown artifact.
  output_modes: [text/plain, text/markdown, application/json]
  streaming: false (capabilities.streaming false; no SSE)
  push_notifications: false
