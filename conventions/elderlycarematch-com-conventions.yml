  params: [limit (max 20, find-care-facilities)]
  response_fields: []
  note: >-
    No cursor or offset. The artifact text says "More may be in range — ask for a higher limit to see them",
    and limit is capped at 20 by the skill description, so a client narrows the query (radiusMiles, careTypes,
    price bounds) rather than paging.
