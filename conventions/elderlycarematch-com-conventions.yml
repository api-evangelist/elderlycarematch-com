  method_names:
    a2a_1_0: [SendMessage, GetTask, ListTasks]
    a2a_0_3_aliases_accepted: [message/send, tasks/get]
    note: The GET descriptor advertises the 1.0 names; the 0.3-era message/send and tasks/get were also accepted on probe.
  message:
    role: user (0.3 form) or ROLE_USER (1.0 form, per the descriptor's example)
    parts: text part (text/plain) or data part (application/json) — the card's defaultInputModes
    skill_selection: >-
      Inferred from the message content; there is no explicit skill id parameter. A JSON data part matching a
      skill's documented filter object (e.g. {"location": "98405", "careTypes": ["Adult AFH"], "hasVacancy": true})
      or a bare {"slug": "..."} selects the skill deterministically; free text is routed by the agent.
